name: StreamLink Batch Processor

on:
  schedule:
   # Runs every 15 minutes to guarantee clean buffer windows
  - cron: '*/15 * * * *'
  workflow_dispatch: 
    # This line adds a manual "Run workflow" button in the GitHub UI!

jobs:
  generate-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup Node.js (for Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloudflare Wrangler
        run: npm install -g wrangler

      - name: Run Python Batch Processor
        env:
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 -u batch_generate.py
