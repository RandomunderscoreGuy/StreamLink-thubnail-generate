name: StreamLink Batch Processor 

on:
  # 🚀 Only allow manual runs and external webhook triggers (cron-job.org)
  workflow_dispatch:

concurrency:
  group: preview-generator
  cancel-in-progress: false

jobs:
  generate-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup Node.js (for Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloudflare Wrangler
        run: npm install -g wrangler

      - name: Install Python Dependencies
        run: pip install boto3

      - name: Run Multi-Cloud Batch Processor
        env:
          ACTIVE_STORAGE: "scaleway" 
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          # Keep R2 keys here so you can swap instantly later
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }} 
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: |
          python3 -u batch_generate.py
